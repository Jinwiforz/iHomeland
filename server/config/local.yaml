environment: local
runtime:
  startupTimeout: 10s
  shutdownTimeout: 10s
logging:
  level: info
  format: text
diagnostic:
  address: 127.0.0.1:8081
  readHeaderTimeout: 3s
  readTimeout: 5s
  writeTimeout: 10s
  idleTimeout: 30s
  maxHeaderBytes: 8192
publicApi:
  address: 127.0.0.1:8080
  readHeaderTimeout: 3s
  readTimeout: 15s
  writeTimeout: 15s
  idleTimeout: 30s
  maxHeaderBytes: 8192
  tls:
    enabled: false
    certificateFile: ""
    privateKeySecret: ""
  endpoints:
    wss:
      host: localhost
      port: 8080
    tlsTcp:
      host: localhost
      port: 8444
  limits:
    httpBodyBytes: 4096
    realtimeFrameBytes: 65536
  rates:
    getVersion: { requests: 120, window: 1m, burst: 20 }
    getBootstrapConfig: { requests: 120, window: 1m, burst: 20 }
    registerAccount: { requests: 10, window: 1m, burst: 3 }
    loginAccount: { requests: 20, window: 1m, burst: 5 }
    refreshSession: { requests: 120, window: 1m, burst: 20 }
    logoutSession: { requests: 120, window: 1m, burst: 20 }
    issueConnectionTicket: { requests: 120, window: 1m, burst: 20 }
    getWorldBootstrap: { requests: 120, window: 1m, burst: 20 }
    acceptVisitInvite: { requests: 120, window: 1m, burst: 20 }
    issueWorldAdmission: { requests: 120, window: 1m, burst: 20 }
  rateMaxEntries: 4096
  rateIdleTtl: 10m
  account:
    maxConcurrentHashes: 2
  session:
    ticketTtl: 30s
    accessTtl: 15m
    refreshTtl: 720h
    sessionTtl: 720h
  placementReplayTtl: 10m
  worldRuntime:
    placementLeaseTtl: 30s
    maxInstances: 512
    deadlineEntries: 65536
  visitSession:
    capacity: 4
    sessionLifetime: 24h
    inviteLifetime: 5m
    reservationLifetime: 1m
    ownerGrace: 2m
    visitorReconnectGrace: 2m
    replayRetention: 10m
  worldAdmission:
    maximumLifetime: 30s
    replayRetention: 5m
    derivationKeySecret: env:IHOMELAND_WORLD_ADMISSION_KEY
  websocketControl:
    path: /v1/control
    subprotocol: ihomeland.control.v1
    allowedHosts: [127.0.0.1:8080, localhost:8080]
    allowedOrigins: []
    preAuthRate: { requests: 60, window: 1m, burst: 10 }
    maxConnections: 4096
    maxPerRemote: 32
    maxPerSession: 4
    maxPerPlayer: 8
    maxRemoteEntries: 4096
    remoteIdleTtl: 10m
    queueItems: 64
    queueBytes: 1048576
    writeTimeout: 5s
    pingInterval: 15s
    pongTimeout: 10s
    idleTimeout: 45s
    closeTimeout: 3s
  gameplayTcp:
    address: 127.0.0.1:8444
    preAuthRate: { requests: 60, window: 1m, burst: 10 }
    maxConnections: 4096
    maxPerRemote: 32
    maxPerSession: 4
    maxPerPlayer: 8
    maxPerTarget: 64
    maxRemoteEntries: 4096
    remoteIdleTtl: 10m
    handshakeBytes: 8192
    readBatchFrames: 16
    queueItems: 64
    queueBytes: 1048576
    handshakeTimeout: 5s
    readTimeout: 15s
    writeTimeout: 5s
    keepAlive: 15s
    idleTimeout: 45s
    closeTimeout: 3s
    shutdownTimeout: 8s
storage:
  mysql:
    address: 127.0.0.1:3306
    database: ihomeland
    username: ihomeland
    passwordSecret: env:IHOMELAND_MYSQL_PASSWORD
    connectTimeout: 3s
    readTimeout: 5s
    writeTimeout: 5s
    migrationLockTimeout: 15s
    pool:
      maxOpenConns: 16
      maxIdleConns: 8
      connMaxLifetime: 30m
      connMaxIdleTime: 5m
    probe:
      interval: 5s
      timeout: 1s
      failureThreshold: 3
    tls:
      enabled: false
      serverName: ""
      caFile: ""
      clientCertificateFile: ""
      clientKeySecret: ""
  redis:
    address: 127.0.0.1:6379
    database: 0
    username: ""
    passwordSecret: env:IHOMELAND_REDIS_PASSWORD
    dialTimeout: 3s
    readTimeout: 2s
    writeTimeout: 2s
    pool:
      size: 16
      minIdleConns: 2
      connMaxLifetime: 30m
      connMaxIdleTime: 5m
    probe:
      interval: 5s
      timeout: 1s
      failureThreshold: 3
    tls:
      enabled: false
      serverName: ""
      caFile: ""
      clientCertificateFile: ""
      clientKeySecret: ""
