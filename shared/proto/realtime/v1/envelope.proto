syntax = "proto3";

package ihomeland.realtime.v1;

import "google/protobuf/any.proto";

option go_package = "ihomeland/server/internal/protocol/pb/realtime/v1;pb";

// MessageID 定义第一阶段实时协议的稳定消息编号。
// 已发布编号不得复用；废弃消息必须在文档中标记并保留编号。
enum MessageID {
  MESSAGE_ID_UNSPECIFIED = 0;

  // 系统与网关消息号段：1-999。
  MESSAGE_ID_HEARTBEAT_REQUEST = 1;
  MESSAGE_ID_HEARTBEAT_RESPONSE = 2;
  MESSAGE_ID_ERROR_RESPONSE = 3;
  MESSAGE_ID_PROTOCOL_VERSION_UNSUPPORTED = 4;

  // 账号会话消息号段：1000-1999。
  MESSAGE_ID_REGISTER_REQUEST = 1000;
  MESSAGE_ID_REGISTER_RESPONSE = 1001;
  MESSAGE_ID_LOGIN_REQUEST = 1002;
  MESSAGE_ID_LOGIN_RESPONSE = 1003;
  MESSAGE_ID_LOGOUT_REQUEST = 1004;
  MESSAGE_ID_LOGOUT_RESPONSE = 1005;
  MESSAGE_ID_RESUME_SESSION_REQUEST = 1006;
  MESSAGE_ID_RESUME_SESSION_RESPONSE = 1007;
  MESSAGE_ID_GET_CURRENT_PLAYER_REQUEST = 1008;
  MESSAGE_ID_GET_CURRENT_PLAYER_RESPONSE = 1009;

  // 房间大厅消息号段：2000-2999。
  MESSAGE_ID_CREATE_ROOM_REQUEST = 2000;
  MESSAGE_ID_CREATE_ROOM_RESPONSE = 2001;
  MESSAGE_ID_JOIN_ROOM_REQUEST = 2002;
  MESSAGE_ID_JOIN_ROOM_RESPONSE = 2003;
  MESSAGE_ID_SET_READY_REQUEST = 2004;
  MESSAGE_ID_SET_READY_RESPONSE = 2005;
  MESSAGE_ID_LEAVE_ROOM_REQUEST = 2006;
  MESSAGE_ID_LEAVE_ROOM_RESPONSE = 2007;
  MESSAGE_ID_TRANSFER_HOST_REQUEST = 2008;
  MESSAGE_ID_TRANSFER_HOST_RESPONSE = 2009;
  MESSAGE_ID_RECONNECT_ROOM_REQUEST = 2010;
  MESSAGE_ID_RECONNECT_ROOM_RESPONSE = 2011;
  MESSAGE_ID_ROOM_SNAPSHOT_PUSHED = 2012;
}

// ErrorCode 定义可跨端识别的稳定错误码。
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_PROTOCOL_VERSION_UNSUPPORTED = 1;
  ERROR_CODE_MESSAGE_ID_UNSUPPORTED = 2;
  ERROR_CODE_PAYLOAD_INVALID = 3;
  ERROR_CODE_REQUEST_ID_REQUIRED = 4;
  ERROR_CODE_ACCOUNT_ALREADY_EXISTS = 5;
  ERROR_CODE_ACCOUNT_CREDENTIAL_INVALID = 6;
  ERROR_CODE_SESSION_INVALID = 7;
  ERROR_CODE_UNAUTHENTICATED = 8;
}

// Envelope 是 WebSocket 与后续 TCP 共用的实时消息信封。
message Envelope {
  // protocol_version 是客户端与服务端显式协商和校验的协议版本。
  uint32 protocol_version = 1;

  // message_id 是稳定消息编号，用于跨语言路由、日志排查和兼容管理。
  MessageID message_id = 2;

  // request_id 用于关联请求、响应和错误；需要响应的消息必须填写。
  string request_id = 3;

  // sequence 是单连接内递增序列号，用于基础顺序排查和重复消息识别。
  uint64 sequence = 4;

  // timestamp_ms 是发送方生成 envelope 时的 Unix 毫秒时间戳。
  int64 timestamp_ms = 5;

  // payload 承载实际 Protobuf 消息；消息类型必须与 message_id 注册表一致。
  google.protobuf.Any payload = 6;
}

// HeartbeatRequest 是客户端到服务端的基础心跳请求。
message HeartbeatRequest {
  int64 client_time_ms = 1;
}

// HeartbeatResponse 是服务端对心跳请求的响应。
message HeartbeatResponse {
  int64 client_time_ms = 1;
  int64 server_time_ms = 2;
}

// ErrorResponse 是服务端返回给客户端的结构化错误响应。
message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
  string detail = 3;
}

// ProtocolVersionUnsupported 描述服务端支持的协议版本范围。
message ProtocolVersionUnsupported {
  uint32 client_version = 1;
  uint32 min_supported_version = 2;
  uint32 max_supported_version = 3;
}

// PlayerProfile 描述客户端进入在线流程所需的玩家基础资料。
message PlayerProfile {
  string player_id = 1;
  string account = 2;
  string display_name = 3;
}

// RegisterRequest 是第一阶段账号注册请求。
message RegisterRequest {
  string account = 1;
  string password = 2;
  string display_name = 3;
}

// RegisterResponse 是第一阶段账号注册响应。
message RegisterResponse {
  PlayerProfile player = 1;
  string session_token = 2;
  int64 expires_at_ms = 3;
}

// LoginRequest 是第一阶段账号登录请求。
message LoginRequest {
  string account = 1;
  string password = 2;
}

// LoginResponse 是第一阶段账号登录响应。
message LoginResponse {
  PlayerProfile player = 1;
  string session_token = 2;
  int64 expires_at_ms = 3;
}

// LogoutRequest 是第一阶段账号登出请求。
message LogoutRequest {
  string session_token = 1;
}

// LogoutResponse 是第一阶段账号登出响应。
message LogoutResponse {
  bool success = 1;
}

// ResumeSessionRequest 是第一阶段会话恢复请求。
message ResumeSessionRequest {
  string session_token = 1;
}

// ResumeSessionResponse 是第一阶段会话恢复响应。
message ResumeSessionResponse {
  PlayerProfile player = 1;
  string session_token = 2;
  int64 expires_at_ms = 3;
}

// GetCurrentPlayerRequest 查询当前连接绑定的玩家身份。
message GetCurrentPlayerRequest {
}

// GetCurrentPlayerResponse 返回当前连接绑定的玩家身份。
message GetCurrentPlayerResponse {
  PlayerProfile player = 1;
  bool authenticated = 2;
}

// RoomState 描述房间生命周期状态。
enum RoomState {
  ROOM_STATE_UNSPECIFIED = 0;
  ROOM_STATE_OPEN = 1;
  ROOM_STATE_CLOSED = 2;
}

// RoomMemberConnectionState 描述房间成员连接状态。
enum RoomMemberConnectionState {
  ROOM_MEMBER_CONNECTION_STATE_UNSPECIFIED = 0;
  ROOM_MEMBER_CONNECTION_STATE_ONLINE = 1;
  ROOM_MEMBER_CONNECTION_STATE_DISCONNECTED = 2;
}

// RoomTeam 描述第一阶段房间阵营。
enum RoomTeam {
  ROOM_TEAM_UNSPECIFIED = 0;
  ROOM_TEAM_A = 1;
  ROOM_TEAM_B = 2;
}

// RoomMemberSnapshot 描述客户端刷新大厅 UI 所需的成员状态。
message RoomMemberSnapshot {
  string player_id = 1;
  uint32 seat = 2;
  RoomTeam team = 3;
  bool ready = 4;
  bool host = 5;
  RoomMemberConnectionState connection_state = 6;
  int64 reconnect_deadline_ms = 7;
}

// RoomSnapshot 描述客户端刷新大厅 UI 所需的房间状态。
message RoomSnapshot {
  string room_id = 1;
  string name = 2;
  RoomState state = 3;
  string host_player_id = 4;
  uint32 capacity = 5;
  repeated RoomMemberSnapshot members = 6;
}

// CreateRoomRequest 是创建自定义房间请求。
message CreateRoomRequest {
  string player_id = 1;
  string room_name = 2;
  uint32 capacity = 3;
}

// CreateRoomResponse 是创建自定义房间响应。
message CreateRoomResponse {
  RoomSnapshot room = 1;
}

// JoinRoomRequest 是加入自定义房间请求。
message JoinRoomRequest {
  string player_id = 1;
  string room_id = 2;
}

// JoinRoomResponse 是加入自定义房间响应。
message JoinRoomResponse {
  RoomSnapshot room = 1;
}

// SetReadyRequest 是设置准备状态请求。
message SetReadyRequest {
  string player_id = 1;
  string room_id = 2;
  bool ready = 3;
}

// SetReadyResponse 是设置准备状态响应。
message SetReadyResponse {
  RoomSnapshot room = 1;
}

// LeaveRoomRequest 是退出房间请求。
message LeaveRoomRequest {
  string player_id = 1;
  string room_id = 2;
}

// LeaveRoomResponse 是退出房间响应。
message LeaveRoomResponse {
  RoomSnapshot room = 1;
}

// TransferHostRequest 是转移房主请求。
message TransferHostRequest {
  string player_id = 1;
  string room_id = 2;
  string target_player_id = 3;
}

// TransferHostResponse 是转移房主响应。
message TransferHostResponse {
  RoomSnapshot room = 1;
}

// ReconnectRoomRequest 是断线后恢复房间身份请求。
message ReconnectRoomRequest {
  string player_id = 1;
  string room_id = 2;
}

// ReconnectRoomResponse 是断线后恢复房间身份响应。
message ReconnectRoomResponse {
  RoomSnapshot room = 1;
}

// RoomSnapshotPushed 是服务端主动推送的房间快照。
message RoomSnapshotPushed {
  RoomSnapshot room = 1;
}
